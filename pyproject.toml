[project]
name = "psylab"
version = "0.1.1"
description = "Mini Psychological Assessment Lab"
readme = "README.md"
authors = [{name = "Stephen Jerge"}]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "rich>=13.6",
    "matplotlib>=3.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
psylab = "psylab.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["psylab*"]
exclude = ["prompts*"]

[tool.setuptools.package-data]
psylab = ["instruments/*.yaml", "templates/*.html"]
